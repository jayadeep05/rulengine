<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background glow gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>

    <!-- Main dynamic flame/breakout vector gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="85%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Quantum neural ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Specular highlight filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background aura -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGlow)"/>

  <!-- Squircle container border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0A1020" fill-opacity="0.9" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Orbital Idea/Quantum rings (Idea spark & algorithmic flow) -->
  <ellipse cx="32" cy="34" rx="20" ry="11" transform="rotate(-28 32 34)" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.65"/>
  <ellipse cx="32" cy="34" rx="20" ry="11" transform="rotate(38 32 34)" stroke="url(#primaryGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>

  <!-- Ascending Breakout Candle & Idea Spark Vector -->
  <!-- Left ascending momentum wing -->
  <path d="M18 42 L25 31 L32 36 L43 20" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Upward Breakout Arrowhead (Alpha Surge) -->
  <path d="M36 19 L44.5 19 L44.5 27.5" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Idea Spark: Central Radiant Core (Synapse / Lightbulb Core) -->
  <circle cx="32" cy="36" r="3.2" fill="#FFFFFF" filter="url(#coreGlow)"/>
  <circle cx="32" cy="36" r="1.8" fill="#FFCC00"/>

  <!-- Breakthrough Neural Node at arrowhead peak -->
  <circle cx="44.5" cy="19" r="2" fill="#00E676" filter="url(#neonGlow)"/>

  <!-- Spark radiation rays -->
  <line x1="32" y1="28" x2="32" y2="30.5" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="26" y1="36" x2="28.5" y2="36" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="38" y1="36" x2="35.5" y2="36" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="27.5" y1="31.5" x2="29" y2="33" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="36.5" y1="31.5" x2="35" y2="33" stroke="#FFAA00" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
